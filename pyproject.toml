[project]
name = "myproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Interesting0_o", email = "2597256916@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uuid-utils>=1.1.0",
    "uuid6>=2025.0.1",
]

[project.scripts]
myproject = "myproject:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
